<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Video Detector</h1>
      <button id="refresh-btn" title="Refresh and re-scan">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M13.65 2.35A7.95 7.95 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L10 6h6V0l-2.35 2.35z"/>
        </svg>
      </button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Scanning for videos...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-state hidden">
      <p>⚠️ Cannot access this page</p>
      <small>This extension cannot run on Chrome internal pages</small>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state hidden">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <p>No videos detected on this page</p>
      <small>Try playing a video first, then click refresh</small>
    </div>

    <!-- Video List -->
    <div id="video-list" class="video-list hidden">
      <!-- Video cards will be dynamically inserted here by popup.js -->
    </div>
  </div>

  <script src="video-downloader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
